<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="/main.css">
<script>
fetch('/metadata.html')
  .then(res => res.text())
  .then(html => document.head.insertAdjacentHTML('afterbegin', html));
</script>
<style>
  .audio-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 10px;
    padding: 16px;
  }
  .audio-grid .tile {
    aspect-ratio: 1;
    border-radius: 2px;
    overflow: hidden;
    cursor: pointer;
    position: relative;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .audio-grid .tile:hover {
    transform: scale(1.03);
  }
  .audio-grid .tile img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .audio-grid .tile .play-icon {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0);
    transition: background 0.2s;
    pointer-events: none;
  }
  .audio-grid .tile:hover .play-icon {
    background: rgba(0,0,0,0);
  }
  .play-icon svg {
    width: 48px;
    height: 48px;
    fill: white;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .audio-grid .tile:hover .play-icon svg {
    opacity: 1;
  }
  .audio-grid .tile .tile-title {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 8px;
    color: white;
    font-size: 13px;
    font-weight: bold;
    background: linear-gradient(transparent, rgba(0,0,0,0.7));
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    word-break: break-word;
  }


  /* lightbox */
  .lb {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.88);
    z-index: 9999;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    gap: 20px;
  }
  .lb.open { display: flex; }
  .lb .lb-close {
    position: absolute;
    top: 16px;
    right: 20px;
    font-size: 32px;
    color: white;
    cursor: pointer;
    background: none;
    border: none;
    font-family: inherit;
    line-height: 1;
  }
  .lb .lb-cover {
    max-width: 400px;
    max-height: 50vh;
    border-radius: 2px;
    object-fit: contain;
  }
  .lb .lb-title {
    color: white;
    font-size: 16px;
    text-align: center;
    max-width: 80vw;
    word-break: break-word;
  }
  .lb audio {
    width: min(400px, 80vw);
  }

  @media (max-width: 480px) {
    .audio-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      padding: 8px;
    }
  }
</style>
</head>
<body>

<div id="topbar-placeholder"></div>
<script>
fetch('/topbar.html')
  .then(r => r.text())
  .then(d => document.getElementById('topbar-placeholder').innerHTML = d);
</script>

<div class="page">
<div class="container">
<div class="box">

  <div id="grid" class="audio-grid"></div>

  <div id="lb" class="lb">
    <button class="lb-close" onclick="closeLB()">&times;</button>
    <img id="lb-cover" class="lb-cover" src="" alt="">
    <div id="lb-title" class="lb-title"></div>
    <audio id="lb-audio" controls></audio>
  </div>

  <script>
    const BASE = '/gallery/audio/';
    const $grid = document.getElementById('grid');
    const $lb = document.getElementById('lb');
    const $lbCover = document.getElementById('lb-cover');
    const $lbTitle = document.getElementById('lb-title');
    const $lbAudio = document.getElementById('lb-audio');

    function openLB(audioUrl, coverUrl, title) {
      $lbCover.src = coverUrl;
      $lbTitle.textContent = title;
      $lbAudio.src = audioUrl;
      $lb.classList.add('open');
    }

    function closeLB() {
      $lbAudio.pause();
      $lbAudio.src = '';
      $lb.classList.remove('open');
    }

    $lb.addEventListener('click', e => {
      if (e.target === $lb) closeLB();
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeLB();
    });

    const playSVG = `<svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>`;

    async function boot() {
      try {
        const res = await fetch(BASE + 'manifest.json', { cache: 'no-cache' });
        if (!res.ok) throw new Error('Manifest not found');
        const pairs = await res.json();

        for (const [audioFile, coverFile] of pairs) {
          const audioUrl = BASE + audioFile;
          const coverUrl = BASE + coverFile;
          const title = audioFile.replace(/\.[^.]+$/, '');

          const tile = document.createElement('div');
          tile.className = 'tile';

          const img = document.createElement('img');
          img.src = coverUrl;
          img.alt = '';
          img.loading = 'lazy';

          const icon = document.createElement('div');
          icon.className = 'play-icon';
          icon.innerHTML = playSVG;

          tile.appendChild(img);
          tile.appendChild(icon);
          const label = document.createElement('div');
          label.className = 'tile-title';
          label.textContent = title;
          tile.appendChild(label);
          tile.onclick = () => openLB(audioUrl, coverUrl, title);

          $grid.appendChild(tile);
        }
      } catch (e) {
        console.error(e);
      }
    }

    boot();
  </script>

</div>
</div>
</div>

</body>
</html>
