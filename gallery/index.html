<html lang="en">
<link rel="stylesheet" href="/main.css">
<script>
  fetch('/metadata.html')
    .then(res => res.text())
    .then(html => document.head.insertAdjacentHTML('afterbegin', html));
</script>
<div id="topbar-placeholder"></div>

</script>
