<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="/main.css">
  <script>
    fetch('/metadata.html')
      .then(res => res.text())
      .then(html => document.head.insertAdjacentHTML('afterbegin', html));
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    .player-wrapper {
      width: min(600px, 90vw);
      margin: 0 auto;
    }

    .now-playing {
      padding: 16px;
      border: 1px solid #ddd;
      background: rgba(0,0,0,0.02);
      margin-bottom: 16px;
    }

    .now-playing.inserting {
      border-color: #999;
      animation: pulse 0.5s ease-in-out 2;
    }

    @keyframes pulse {
      0%,100% { background: rgba(0,0,0,0.02); }
      50% { background: rgba(0,0,0,0.06); }
    }

    .now-playing-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .now-playing-cover {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 4px;
      display: none;
      flex-shrink: 0;
    }

    .now-playing-cover.visible { display: block; }

    .now-playing-cover.spinning {
      animation: spin 4s linear infinite;
      border-radius: 50%;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .now-playing-info { flex: 1; min-width: 0; }

    .now-playing-label {
      color: #999;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .now-playing-title {
      color: #999;
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .now-playing-title.active { color: #333; }

    .now-playing audio { width: 100%; }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .controls-left, .controls-right {
      display: flex;
      gap: 8px;
    }

    .controls button {
      background: none;
      border: 1px solid #ccc;
      color: #999;
      border-radius: 4px;
      padding: 5px 12px;
      cursor: pointer;
      font-family: monospace;
      font-size: 12px;
      transition: all 0.2s;
    }

    .controls button:hover:not(.disabled) { border-color: #999; color: #333; }
    .controls button.on { border-color: #333; color: #333; }

    .controls button.disabled {
      opacity: 0.3;
      cursor: default;
      pointer-events: none;
    }

    .controls button .icon {
      display: inline-block;
      font-family: sans-serif;
      font-style: normal;
      font-size: 14px;
      line-height: 1;
      vertical-align: middle;
    }

    .section-label {
      font-size: 11px;
      color: #aaa;
      padding: 8px 12px 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .playlist-list { list-style: none; }

    .playlist-list li {
      padding: 10px 12px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      font-size: 14px;
      color: #999;
      transition: color 0.2s;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .playlist-list li:hover { color: #333; }
    .playlist-list li.active { color: #000; font-weight: bold; }

    .playlist-list li img {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: 2px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div id="topbar-placeholder"></div>
  <script>
    fetch('/topbar.html')
      .then(r => r.text())
      .then(d => document.getElementById('topbar-placeholder').innerHTML = d);
  </script>

  <div class="page">
    <div class="container">
      <div class="box">

        <div class="player-wrapper">
          <div id="now-playing" class="now-playing">
            <div class="now-playing-top">
              <img id="now-cover" class="now-playing-cover" src="" alt="">
              <div class="now-playing-info">
                <div class="now-playing-label">now playing</div>
                <div id="now-title" class="now-playing-title">nothing playing</div>
              </div>
            </div>
            <audio id="audio" controls></audio>
            <div class="controls">
              <div class="controls-left">
                <button id="shuffle-btn" class="on" onclick="toggleShuffle()">shuffle</button>
                <button id="loop-btn" class="on" onclick="toggleLoop()">loop</button>
              </div>
              <div class="controls-right">
                <button id="skip-btn" class="disabled" onclick="skipTrack()"><span class="icon">⏭</span></button>
                <button id="eject-btn" class="disabled" onclick="eject()"><span class="icon">⏏</span></button>
              </div>
            </div>
          </div>

          <div class="section-label">playlists</div>
          <ul id="playlist-list" class="playlist-list"></ul>
        </div>

        <audio id="insert-sfx" src="/gallery/insert.wav" preload="auto"></audio>
        <audio id="eject-sfx" src="/gallery/eject.wav" preload="auto"></audio>

        <script>
          const $audio = document.getElementById('audio');
          const $title = document.getElementById('now-title');
          const $cover = document.getElementById('now-cover');
          const $nowPlaying = document.getElementById('now-playing');
          const $playlistList = document.getElementById('playlist-list');
          const $shuffleBtn = document.getElementById('shuffle-btn');
          const $loopBtn = document.getElementById('loop-btn');
          const $skipBtn = document.getElementById('skip-btn');
          const $ejectBtn = document.getElementById('eject-btn');
          const $insertSfx = document.getElementById('insert-sfx');
          const $ejectSfx = document.getElementById('eject-sfx');

          let data = null;
          let currentPlaylist = null;
          let currentIndex = -1;
          let shuffleOn = true;
          let loopOn = true;
          let playOrder = [];
          let inserting = false;

          function setStatus(text, active) {
            $title.textContent = text;
            document.title = text;
            $title.classList.toggle('active', !!active);
          }

          function setTransportEnabled(enabled) {
            $skipBtn.classList.toggle('disabled', !enabled);
            $ejectBtn.classList.toggle('disabled', !enabled);
          }

          function toggleShuffle() {
            shuffleOn = !shuffleOn;
            $shuffleBtn.classList.toggle('on', shuffleOn);
            if (currentPlaylist) buildOrder();
          }

          function toggleLoop() {
            loopOn = !loopOn;
            $loopBtn.classList.toggle('on', loopOn);
          }

          function buildOrder() {
            const len = currentPlaylist.tracks.length;
            playOrder = [...Array(len).keys()];
            if (shuffleOn) {
              for (let i = playOrder.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [playOrder[i], playOrder[j]] = [playOrder[j], playOrder[i]];
              }
            }
          }

          function playTrack(index) {
            const track = currentPlaylist.tracks[index];
            if (!track) return;
            currentIndex = index;
            $audio.src = track.src;
            $audio.play().catch(() => {});
            setStatus(track.title, true);

            if (currentPlaylist.image) {
              $cover.src = currentPlaylist.image;
              $cover.classList.add('visible');
              $cover.classList.add('spinning');
            } else {
              $cover.classList.remove('visible');
              $cover.classList.remove('spinning');
            }

            setTransportEnabled(true);
          }

          function nextTrack() {
            const pos = playOrder.indexOf(currentIndex);
            if (pos + 1 < playOrder.length) {
              playTrack(playOrder[pos + 1]);
            } else if (loopOn) {
              if (shuffleOn) buildOrder();
              playTrack(playOrder[0]);
            }
          }

          function skipTrack() {
            if (!currentPlaylist || inserting) return;
            nextTrack();
          }

          function eject() {
            if (inserting || !currentPlaylist) return;

            $audio.pause();
            $audio.src = '';

            $ejectSfx.currentTime = 0;
            $ejectSfx.play().catch(() => {});

            $cover.classList.remove('visible');
            $cover.classList.remove('spinning');
            setStatus('nothing playing', false);
            setTransportEnabled(false);

            currentPlaylist = null;
            currentIndex = -1;

            document.querySelectorAll('.playlist-list li').forEach(li => {
              li.classList.remove('active');
            });
          }

          $audio.addEventListener('ended', nextTrack);

          function startPlaylist(index) {
            if (inserting) return;
            inserting = true;

            $audio.pause();
            $audio.src = '';

            $insertSfx.currentTime = 0;
            $insertSfx.play().catch(() => {});

            $nowPlaying.classList.add('inserting');
            $cover.classList.remove('visible');
            $cover.classList.remove('spinning');
            setStatus('loading...', false);
            setTransportEnabled(false);

            currentPlaylist = data.playlists[index];
            buildOrder();

            document.querySelectorAll('.playlist-list li').forEach((li, i) => {
              li.classList.toggle('active', i === index);
            });

            setTimeout(() => {
              $nowPlaying.classList.remove('inserting');
              playTrack(playOrder[0]);
              inserting = false;
            }, 1000);
          }

          async function boot() {
            setStatus('nothing playing', false);
            try {
              const res = await fetch('main.json', { cache: 'no-cache' });
              if (!res.ok) throw new Error('failed to load main.json');
              data = await res.json();
              data.playlists.forEach((pl, i) => {
                const li = document.createElement('li');
                if (pl.image) {
                  const img = document.createElement('img');
                  img.src = pl.image;
                  img.alt = '';
                  li.appendChild(img);
                }
                const span = document.createElement('span');
                span.textContent = pl.name;
                li.appendChild(span);
                li.addEventListener('click', () => startPlaylist(i));
                $playlistList.appendChild(li);
              });
            } catch (e) {
              console.error(e);
            }
          }

          boot();
        </script>

      </div>
    </div>
  </div>

</body>
</html>
